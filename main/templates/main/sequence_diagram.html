{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Sequence Diagram Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1e293b;}
    .page-wrapper{max-width:1000px;margin:0 auto;padding:32px 24px 80px;}

    h1{font-size:22px;font-weight:600;color:#0f172a;margin-bottom:4px;}
    .subtitle{font-size:13px;color:#64748b;margin-bottom:28px;}

    /* Feature card */
    .feat-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:16px;overflow:hidden;transition:box-shadow .2s;}
    .feat-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);}

    .feat-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none;}
    .feat-header:hover{background:#f8fafc;}
    .feat-left{display:flex;align-items:center;gap:14px;}
    .feat-num{width:32px;height:32px;border-radius:50%;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
    .feat-name{font-size:14px;font-weight:600;}
    .feat-sub{font-size:12px;color:#94a3b8;margin-top:2px;}
    .chevron{transition:transform .25s;color:#94a3b8;}
    .chevron.open{transform:rotate(180deg);}

    .feat-body{display:none;border-top:1px solid #f1f5f9;padding:24px;}
    .feat-body.open{display:block;}

    /* Section labels */
    .section-label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}

    /* Entity selector */
    .entity-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
    .entity-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid #e2e8f0;border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;user-select:none;}
    .entity-chip input[type=checkbox]{accent-color:#3b82f6;cursor:pointer;}
    .entity-chip:hover{border-color:#93c5fd;background:#eff6ff;}
    .entity-chip.checked{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8;}
    .no-sql-hint{font-size:12px;color:#94a3b8;padding:10px;background:#f8fafc;border-radius:6px;margin-bottom:20px;}

    /* Method inputs */
    .method-grid{display:grid;gap:10px;margin-bottom:20px;}
    .method-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:12px;}
    .method-arrow{color:#94a3b8;text-align:center;}
    input[type=text],select{width:100%;padding:7px 10px;border-radius:6px;border:1px solid #e2e8f0;font-size:12px;font-family:'Inter',sans-serif;background:#fff;color:#1e293b;}
    input[type=text]:focus,select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.1);}
    .method-label{font-size:11px;color:#94a3b8;margin-bottom:4px;}

    /* Generate button */
    .gen-btn{padding:9px 20px;background:#1e293b;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .2s;}
    .gen-btn:hover{opacity:.85;}
    .gen-btn:disabled{opacity:.4;cursor:not-allowed;}

    /* Result */
    .result-box{margin-top:16px;display:none;}
    .diagram-img{width:100%;border-radius:8px;border:1px solid #e2e8f0;}
    .code-toggle{margin-top:8px;font-size:12px;color:#3b82f6;cursor:pointer;background:none;border:none;padding:0;}
    .code-box{background:#1e293b;border-radius:8px;padding:14px;margin-top:8px;display:none;}
    .code-box pre{color:#4ade80;font-family:'Fira Mono',monospace;font-size:11px;white-space:pre-wrap;word-wrap:break-word;}
    .download-row{display:flex;gap:8px;margin-top:8px;}
    .dl-btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:opacity .2s;}
    .dl-btn:hover{opacity:.85;}
    .dl-png{background:#059669;color:#fff;}
    .dl-puml{background:#475569;color:#fff;}
    .gen-error{padding:12px;background:#fee2e2;color:#991b1b;border-radius:6px;font-size:12px;margin-top:8px;}

    /* Dynamic row buttons */
    .add-row-btn{margin-top:6px;padding:5px 12px;font-size:11px;background:#f1f5f9;color:#475569;border:1px dashed #cbd5e1;border-radius:6px;cursor:pointer;transition:all .15s;}
    .add-row-btn:hover{background:#e2e8f0;border-color:#94a3b8;}
    .row-remove-btn{padding:4px 8px;font-size:11px;background:#fee2e2;color:#991b1b;border:none;border-radius:5px;cursor:pointer;flex-shrink:0;transition:opacity .15s;}
    .row-remove-btn:hover{opacity:.7;}
    .ab-row,.self-call-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;margin-bottom:6px;}
    .self-call-row{grid-template-columns:1fr auto;}

    /* Navigation */
    .navigation{display:flex;justify-content:space-between;margin-top:32px;gap:12px;}
    .nav-btn{padding:11px 24px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;text-decoration:none;transition:opacity .2s;}
    .nav-btn-back{background:#f1f5f9;color:#475569;}
    .nav-btn-next{background:#1e293b;color:#fff;}
    .nav-btn:hover{opacity:.85;}

    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<div class="page-wrapper">
  {% include 'main/stepper.html' with current_step=9 %}

  <h1>Sequence Diagram</h1>
  <p class="subtitle">Define entities and method names per feature, then generate the sequence diagram.</p>

  <div id="feature-list"><p style="color:#94a3b8;font-size:14px;">Loading features...</p></div>

  <div class="navigation">
    <a href="{% url 'main:import_sql' %}" class="nav-btn nav-btn-back">← Back</a>
    <a href="{% url 'main:class_diagram' %}" id="nextBtn" class="nav-btn nav-btn-next">Next →</a>
  </div>
</div>

<script>
// ---- SQL entities from DB context ----
let sqlTables = [];
let guiPages = [];
try {
  sqlTables = JSON.parse(`{{ sql_tables_json|escapejs }}`);
} catch(e) {
  // fallback to localStorage if needed
  try {
    const raw = localStorage.getItem('sqlData');
    if (raw) {
      const d = JSON.parse(raw);
      sqlTables = (d.tables || []).map(t => t.name || t);
    }
  } catch(err) {}
}

try {
  guiPages = JSON.parse(`{{ gui_pages_json|escapejs }}`);
} catch(e) {}

// ---- Load features from API ----
async function loadFeatures() {
  const container = document.getElementById('feature-list');
  try {
    const res = await fetch("{% url 'main:sequence_feature_list' %}", { credentials: 'same-origin' });
    const features = await res.json();
    if (!features.length) {
      container.innerHTML = '<p style="color:#ef4444;font-size:13px;">No features found. Complete Use Case Specification first.</p>';
      return;
    }
    container.innerHTML = '';
    features.forEach((feat, idx) => buildFeatureCard(feat, idx + 1, container));
  } catch(e) {
    container.innerHTML = `<p style="color:#ef4444;font-size:13px;">Error loading features: ${e.message}</p>`;
  }
}

function buildFeatureCard(feat, num, container) {
  let cfg = {};
  if (feat.sequence_config_json) {
    try { cfg = JSON.parse(feat.sequence_config_json); } catch(e) {}
  }

  const selectedEntities = cfg.selected_entities || [];
  const actorBoundaryMethods = cfg.actor_boundary_methods && cfg.actor_boundary_methods.length > 0 ? cfg.actor_boundary_methods : ['requestAction()'];
  const boundarySelfCalls = cfg.boundary_self_calls || [];
  const controllerSelfCalls = cfg.controller_self_calls || [];
  const bndName = cfg.boundary_name || (guiPages.length ? guiPages[0] : 'System UI');
  const bndCtrlMethod = cfg.boundary_controller_method || 'processRequest()';
  const ctrlEntityMethods = cfg.ctrl_entity_methods || {};

  const altCond = cfg.alt_condition || '';
  const altAB = cfg.alt_actor_boundary || '';
  const altBS = cfg.alt_boundary_self || '';
  const altBC = cfg.alt_boundary_ctrl || '';
  const altCS = cfg.alt_ctrl_self || '';
  const altCE = cfg.alt_ctrl_entity || '';
  const altRes = cfg.alt_response || '';

  const excCond = cfg.exc_condition || '';
  const excAB = cfg.exc_actor_boundary || '';
  const excBS = cfg.exc_boundary_self || '';
  const excBC = cfg.exc_boundary_ctrl || '';
  const excCS = cfg.exc_ctrl_self || '';
  const excCE = cfg.exc_ctrl_entity || '';
  const excRes = cfg.exc_response || '';

  const card = document.createElement('div');
  card.className = 'feat-card';
  card.dataset.featureId = feat.id;

  // Entity chips HTML
  const entityHtml = sqlTables.length
    ? sqlTables.map(t => {
        const isChecked = selectedEntities.includes(t) ? 'checked' : '';
        const chipClass = isChecked ? 'entity-chip checked' : 'entity-chip';
        return `
        <label class="${chipClass}">
          <input type="checkbox" value="${t}" onchange="toggleChip(this)" ${isChecked}> ${t}
        </label>`;
      }).join('')
    : `<div class="no-sql-hint">No SQL tables imported yet. <a href="{% url 'main:import_sql' %}" style="color:#3b82f6;">Import SQL first</a> to select DB entities.</div>`;

  const pageOptions = guiPages.length 
    ? guiPages.map(p => `<option value="${p}" ${p === bndName ? 'selected' : ''}>${p}</option>`).join('')
    : `<option value="System UI" ${bndName === 'System UI' ? 'selected' : ''}>System UI (Default)</option>`;

  const abHtml = actorBoundaryMethods.map(m => `
    <div class="method-row ab-row">
      <input type="text" class="m-actor-boundary" placeholder="e.g. submitLoginForm()" value="${m}"/>
      <div class="method-arrow">→</div>
      <div class="display-boundary-name" style="color:#64748b;font-size:12px;font-weight:500;">${bndName}</div>
      <button class="row-remove-btn" onclick="removeRow(this)" title="Remove">✕</button>
    </div>
  `).join('');

  const bndSelfHtml = boundarySelfCalls.map(m => `
    <div class="method-row self-call-row">
      <input type="text" class="m-self-call" data-list="boundary-self-list" placeholder="e.g. validateInput()" value="${m}"/>
      <button class="row-remove-btn" onclick="removeRow(this)" title="Remove">✕</button>
    </div>
  `).join('');

  const ctrlSelfHtml = controllerSelfCalls.map(m => `
    <div class="method-row self-call-row">
      <input type="text" class="m-self-call" data-list="controller-self-list" placeholder="e.g. calculateTotal()" value="${m}"/>
      <button class="row-remove-btn" onclick="removeRow(this)" title="Remove">✕</button>
    </div>
  `).join('');

  const ctrlEntityHtml = selectedEntities.length
    ? selectedEntities.map(name => {
        const val = ctrlEntityMethods[name] || 'query()';
        return `
        <div class="method-row" data-entity="${name}">
          <div style="color:#0f172a;font-size:12px;font-weight:500;">Controller</div>
          <div class="method-arrow">→</div>
          <div style="flex:1;">
            <input type="text" class="m-ctrl-entity" placeholder="e.g. findUser(id)" value="${val}" data-entity="${name}"/>
            <div style="font-size:11px;color:#94a3b8;margin-top:3px;">on: ${name}</div>
          </div>
        </div>`;
      }).join('')
    : '<div style="font-size:12px;color:#94a3b8;">Select entities above to define methods.</div>';

  card.innerHTML = `
    <div class="feat-header" onclick="toggleCard(this)">
      <div class="feat-left">
        <div class="feat-num">${num}</div>
        <div>
          <div class="feat-name">${feat.title || 'Untitled'}</div>
          <div class="feat-sub">GUI: ${feat.gui || '—'}</div>
        </div>
      </div>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="feat-body">

      <!-- 1. Entity selector -->
      <div class="section-label">1. Select DB Entities (from imported SQL)</div>
      <div class="entity-grid">${entityHtml}</div>

      <!-- 2. Boundary selector -->
      <div class="section-label" style="margin-top: 15px;">2. Select Boundary (GUI)</div>
      <div style="margin-bottom: 15px;">
        <select class="m-boundary-name" onchange="updateBoundaryLabel(this)" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px;">
          ${pageOptions}
        </select>
      </div>

      <!-- 3. Method names -->
      <div class="section-label">3. Define Method Names</div>
      <div class="method-grid">

        <!-- Actor → Boundary (multiple) -->
        <div>
          <div class="method-label">Actor → Boundary <span style="color:#94a3b8;font-weight:400;">(bisa lebih dari 1)</span></div>
          <div class="actor-boundary-list">
            ${abHtml}
          </div>
          <button class="add-row-btn" onclick="addActorBoundaryRow(this)">+ Add Method</button>
        </div>

        <!-- Boundary Self-Call (optional) -->
        <div style="margin-top:14px;">
          <div class="method-label">Boundary Self-Call <span style="color:#94a3b8;font-weight:400;">(opsional — proses internal Boundary)</span></div>
          <div class="boundary-self-list">${bndSelfHtml}</div>
          <button class="add-row-btn" onclick="addSelfCallRow(this, 'boundary-self-list', 'Boundary → Boundary')">+ Add Self-Call</button>
        </div>

        <!-- Boundary → Controller -->
        <div style="margin-top:14px;">
          <div class="method-label">Boundary → Controller</div>
          <div class="method-row">
            <div class="display-boundary-name" style="color:#64748b;font-size:12px;">${bndName}</div>
            <div class="method-arrow">→</div>
            <input type="text" class="m-boundary-controller" placeholder="e.g. processRequest()" value="${bndCtrlMethod}"/>
          </div>
        </div>

        <!-- Controller Self-Call (optional) -->
        <div style="margin-top:14px;">
          <div class="method-label">Controller Self-Call <span style="color:#94a3b8;font-weight:400;">(opsional — logic internal Controller)</span></div>
          <div class="controller-self-list">${ctrlSelfHtml}</div>
          <button class="add-row-btn" onclick="addSelfCallRow(this, 'controller-self-list', 'Controller → Controller')">+ Add Self-Call</button>
        </div>

        <!-- Controller → Entity -->
        <div style="margin-top:14px;">
          <div class="method-label">Controller → Entity (per selected entity)</div>
          <div class="entity-method-rows">
            ${ctrlEntityHtml}
          </div>
        </div>

      </div>

      <!-- 4. Alternative Flow (Optional) -->
      <div style="margin-top:14px;padding:14px 16px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px; display: ${feat.has_alt ? 'block' : 'none'};">
        <div class="section-label" style="color:#15803d;margin-bottom:10px;">4. Alternative Flow (Optional)</div>
        <div class="method-grid">
          <div>
            <div class="method-label">Condition / Trigger</div>
            <input type="text" class="m-alt-condition" placeholder="e.g. Asset Not Found" value="${altCond}"/>
          </div>
          <div>
            <div class="method-label">Actor → Boundary</div>
            <input type="text" class="m-alt-actor-boundary" placeholder="e.g. searchAgain()" value="${altAB}"/>
          </div>
          <div>
            <div class="method-label">Boundary Self-call</div>
            <input type="text" class="m-alt-boundary-self" placeholder="e.g. validateInput()" value="${altBS}"/>
          </div>
          <div>
            <div class="method-label">Boundary → Controller</div>
            <input type="text" class="m-alt-boundary-ctrl" placeholder="e.g. searchAsset()" value="${altBC}"/>
          </div>
          <div>
            <div class="method-label">Controller Self-call</div>
            <input type="text" class="m-alt-ctrl-self" placeholder="e.g. revalidate()" value="${altCS}"/>
          </div>
          <div>
            <div class="method-label">Controller → Entity</div>
            <input type="text" class="m-alt-ctrl-entity" placeholder="e.g. checkStatus()" value="${altCE}"/>
          </div>
          <div>
            <div class="method-label">Return Message (Response)</div>
            <input type="text" class="m-alt-response" placeholder="e.g. displayNoData()" value="${altRes}"/>
          </div>
        </div>
      </div>

      <!-- 5. Exception Flow (Optional) -->
      <div style="margin-top:14px;padding:14px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px; display: ${feat.has_exc ? 'block' : 'none'};">
        <div class="section-label" style="color:#c2410c;margin-bottom:10px;">5. Exception Flow (Optional)</div>
        <div class="method-grid">
          <div>
            <div class="method-label">Condition / Trigger</div>
            <input type="text" class="m-exc-condition" placeholder="e.g. Connection Timeout" value="${excCond}"/>
          </div>
          <div>
            <div class="method-label">Actor → Boundary</div>
            <input type="text" class="m-exc-actor-boundary" placeholder="e.g. retryRequest()" value="${excAB}"/>
          </div>
          <div>
            <div class="method-label">Boundary Self-call</div>
            <input type="text" class="m-exc-boundary-self" placeholder="e.g. logError()" value="${excBS}"/>
          </div>
          <div>
            <div class="method-label">Boundary → Controller</div>
            <input type="text" class="m-exc-boundary-ctrl" placeholder="e.g. requestMarket()" value="${excBC}"/>
          </div>
          <div>
            <div class="method-label">Controller Self-call</div>
            <input type="text" class="m-exc-ctrl-self" placeholder="e.g. logError()" value="${excCS}"/>
          </div>
          <div>
            <div class="method-label">Controller → Entity</div>
            <input type="text" class="m-exc-ctrl-entity" placeholder="e.g. updateStatus()" value="${excCE}"/>
          </div>
          <div>
            <div class="method-label">Return Message (Response)</div>
            <input type="text" class="m-exc-response" placeholder="e.g. showConnectionError()" value="${excRes}"/>
          </div>
        </div>
      </div>


      <!-- 3. Generate button -->
      <button class="gen-btn" onclick="generateDiagram(this, ${feat.id})">
        ▶ Generate Sequence Diagram
      </button>

      <!-- Result -->
      <div class="result-box">
        <img class="diagram-img" src="" alt="Sequence Diagram"/>
        <div class="download-row">
          <button class="dl-btn dl-png" onclick="downloadPNG(this)">↓ PNG</button>
          <button class="dl-btn dl-puml" onclick="downloadPUML(this)">↓ PlantUML</button>
          <button class="code-toggle" onclick="toggleCode(this)">Show Code</button>
        </div>
        <div class="code-box"><pre></pre></div>
      </div>
    </div>
  `;
  container.appendChild(card);
}

function updateBoundaryLabel(selectElem) {
  const card = selectElem.closest('.feat-card');
  const labels = card.querySelectorAll('.display-boundary-name');
  labels.forEach(label => {
    label.textContent = selectElem.value;
  });
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const icon = header.querySelector('.chevron');
  body.classList.toggle('open');
  icon.classList.toggle('open');
}

function toggleChip(checkbox) {
  const chip = checkbox.closest('.entity-chip');
  chip.classList.toggle('checked', checkbox.checked);
  const card = chip.closest('.feat-card');
  updateEntityMethodRows(card);
}

function updateEntityMethodRows(card) {
  const selected = [...card.querySelectorAll('.entity-chip input:checked')].map(c => c.value);
  const container = card.querySelector('.entity-method-rows');
  if (!selected.length) {
    container.innerHTML = '<div style="font-size:12px;color:#94a3b8;">Select entities above to define methods.</div>';
    return;
  }
  container.innerHTML = selected.map(name => `
    <div class="method-row" data-entity="${name}">
      <div style="color:#0f172a;font-size:12px;font-weight:500;">Controller</div>
      <div class="method-arrow">→</div>
      <div style="flex:1;">
        <input type="text" class="m-ctrl-entity" placeholder="e.g. findUser(id)" value="query()" data-entity="${name}"/>
        <div style="font-size:11px;color:#94a3b8;margin-top:3px;">on: ${name}</div>
      </div>
    </div>`).join('');
}

// ── Dynamic row helpers ──────────────────────────────────────
function addActorBoundaryRow(btn) {
  const list = btn.previousElementSibling; // .actor-boundary-list
  const card = btn.closest('.feat-card');
  const boundaryName = card.querySelector('.m-boundary-name').value || (guiPages[0] || 'System UI');
  const row = document.createElement('div');
  row.className = 'method-row ab-row';
  row.innerHTML = `
    <input type="text" class="m-actor-boundary" placeholder="e.g. enterPassword()" value=""/>
    <div class="method-arrow">→</div>
    <div class="display-boundary-name" style="color:#64748b;font-size:12px;font-weight:500;">${boundaryName}</div>
    <button class="row-remove-btn" onclick="removeRow(this)" title="Remove">✕</button>`;
  list.appendChild(row);
  syncExceptionStepOptions(card);
}

// removed syncExceptionStepOptions and addFlowMethodRow

function addSelfCallRow(btn, listClass, label) {
  const list = btn.previousElementSibling; // .boundary-self-list or .controller-self-list
  const row = document.createElement('div');
  row.className = 'method-row self-call-row';
  row.innerHTML = `
    <input type="text" class="m-self-call" data-list="${listClass}" placeholder="e.g. validateInput()" value=""/>
    <button class="row-remove-btn" onclick="removeRow(this)" title="Remove">✕</button>`;
  list.appendChild(row);
}

function removeRow(btn) {
  const card = btn.closest('.feat-card');
  btn.closest('.method-row').remove();
  if (card) syncExceptionStepOptions(card);
}

// ── Generate ─────────────────────────────────────────────────
async function generateDiagram(btn, featureId) {
  const card = btn.closest('.feat-card');
  const resultBox = card.querySelector('.result-box');
  const img = card.querySelector('.diagram-img');
  const errEl = card.querySelector('.gen-error');
  if (errEl) errEl.remove();

  // Collect form data
  const selectedEntities = [...card.querySelectorAll('.entity-chip input:checked')].map(c => c.value);

  // Multiple Actor→Boundary methods (Basic Flow)
  const actorBoundaryMethods = [...card.querySelectorAll('.m-actor-boundary')]
    .map(i => i.value.trim()).filter(Boolean);
  if (!actorBoundaryMethods.length) actorBoundaryMethods.push('requestAction()');

  // Alternative Flow config
  const altCondition = card.querySelector('.m-alt-condition')?.value.trim() || '';
  const altActorBoundary = card.querySelector('.m-alt-actor-boundary')?.value.trim() || '';
  const altBoundarySelf = card.querySelector('.m-alt-boundary-self')?.value.trim() || '';
  const altBoundaryCtrl = card.querySelector('.m-alt-boundary-ctrl')?.value.trim() || '';
  const altCtrlSelf = card.querySelector('.m-alt-ctrl-self')?.value.trim() || '';
  const altCtrlEntity = card.querySelector('.m-alt-ctrl-entity')?.value.trim() || '';
  const altResponse = card.querySelector('.m-alt-response')?.value.trim() || '';

  // Exception Flow config
  const excCondition = card.querySelector('.m-exc-condition')?.value.trim() || '';
  const excActorBoundary = card.querySelector('.m-exc-actor-boundary')?.value.trim() || '';
  const excBoundarySelf = card.querySelector('.m-exc-boundary-self')?.value.trim() || '';
  const excBoundaryCtrl = card.querySelector('.m-exc-boundary-ctrl')?.value.trim() || '';
  const excCtrlSelf = card.querySelector('.m-exc-ctrl-self')?.value.trim() || '';
  const excCtrlEntity = card.querySelector('.m-exc-ctrl-entity')?.value.trim() || '';
  const excResponse = card.querySelector('.m-exc-response')?.value.trim() || '';

  // Boundary self-calls
  const boundarySelfCalls = [...card.querySelectorAll('.boundary-self-list .m-self-call')]
    .map(i => i.value.trim()).filter(Boolean);

  // Controller self-calls
  const controllerSelfCalls = [...card.querySelectorAll('.controller-self-list .m-self-call')]
    .map(i => i.value.trim()).filter(Boolean);

  const boundaryCtrl = card.querySelector('.m-boundary-controller').value.trim() || 'processRequest()';
  const boundaryName = card.querySelector('.m-boundary-name').value.trim() || 'System UI';

  const ctrlEntityMethods = {};
  card.querySelectorAll('.m-ctrl-entity').forEach(inp => {
    ctrlEntityMethods[inp.dataset.entity] = inp.value.trim() || 'query()';
  });

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generating...';
  resultBox.style.display = 'none';

  try {
    const res = await fetch(`/api/sequence/${featureId}/generate/`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
      body: JSON.stringify({
        selected_entities:          selectedEntities,
        actor_boundary_methods:     actorBoundaryMethods,
        boundary_controller_method: boundaryCtrl,
        boundary_name:              boundaryName,
        ctrl_entity_methods:        ctrlEntityMethods,
        boundary_self_calls:        boundarySelfCalls,
        controller_self_calls:      controllerSelfCalls,
        alt_condition:              altCondition,
        alt_actor_boundary:         altActorBoundary,
        alt_boundary_self:          altBoundarySelf,
        alt_boundary_ctrl:          altBoundaryCtrl,
        alt_ctrl_self:              altCtrlSelf,
        alt_ctrl_entity:            altCtrlEntity,
        alt_response:               altResponse,
        exc_condition:              excCondition,
        exc_actor_boundary:         excActorBoundary,
        exc_boundary_self:          excBoundarySelf,
        exc_boundary_ctrl:          excBoundaryCtrl,
        exc_ctrl_self:              excCtrlSelf,
        exc_ctrl_entity:            excCtrlEntity,
        exc_response:               excResponse,
      })
    });
    const data = await res.json();

    if (!res.ok || data.status !== 'success') throw new Error(data.message || 'Generation failed');

    img.src = 'data:image/png;base64,' + data.image_base64;
    img.dataset.base64 = data.image_base64;
    img.dataset.puml = data.plantuml;
    card.querySelector('.code-box pre').textContent = data.plantuml;
    resultBox.style.display = 'block';
  } catch(e) {
    const err = document.createElement('div');
    err.className = 'gen-error';
    err.textContent = 'Error: ' + e.message;
    btn.insertAdjacentElement('afterend', err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ Generate Sequence Diagram';
  }
}

function toggleCode(btn) {
  const box = btn.closest('.result-box').querySelector('.code-box');
  const isOpen = box.style.display === 'block';
  box.style.display = isOpen ? 'none' : 'block';
  btn.textContent = isOpen ? 'Show Code' : 'Hide Code';
}

function downloadPNG(btn) {
  const img = btn.closest('.result-box').querySelector('.diagram-img');
  const a = document.createElement('a');
  a.href = 'data:image/png;base64,' + img.dataset.base64;
  a.download = 'sequence_diagram.png';
  a.click();
}

function downloadPUML(btn) {
  const code = btn.closest('.result-box').querySelector('.code-box pre').textContent;
  const blob = new Blob([code], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sequence_diagram.puml';
  a.click();
}

function getCsrf() {
  const c = document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='));
  return c ? c.trim().split('=')[1] : '';
}

document.addEventListener('DOMContentLoaded', () => {
  loadFeatures();
  
  // Save configurations when clicking Next
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      const configs = [];
      document.querySelectorAll('.feat-card').forEach(card => {
        const featureName = card.querySelector('.feat-name').textContent.trim() || 'Untitled';
        const boundaryNameElem = card.querySelector('.m-boundary-name');
        const boundaryName = boundaryNameElem ? boundaryNameElem.value.trim() : 'System UI';
        const actorBoundary = card.querySelector('.m-actor-boundary').value.trim() || 'requestAction()';
        const boundaryCtrl = card.querySelector('.m-boundary-controller').value.trim() || 'processRequest()';
        const selectedEntities = [...card.querySelectorAll('.entity-chip input:checked')].map(c => c.value);
        
        const ctrlEntityMethods = {};
        card.querySelectorAll('.m-ctrl-entity').forEach(inp => {
          ctrlEntityMethods[inp.dataset.entity] = inp.value.trim() || 'query()';
        });

        configs.push({
          featureName,
          boundaryName,
          actorBoundaryMethod: actorBoundary,
          boundaryCtrlMethod: boundaryCtrl,
          selectedEntities,
          ctrlEntityMethods
        });
      });
      localStorage.setItem('sequenceConfigs', JSON.stringify(configs));
    });
  }
});
</script>
</body>
</html>
